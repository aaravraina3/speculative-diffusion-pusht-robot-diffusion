[project]
name = "speculative-diffusion-pusht"
version = "0.2.0"
description = "Speculative serving for lerobot/diffusion_pusht, with a held-out, paired evaluation (spec_eval.py)"
requires-python = ">=3.12"
# Pinned to the environment the results were produced in.
dependencies = [
    "lerobot==0.4.4",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "diffusers==0.35.2",
    "numpy==2.5.0",
    "pandas==3.0.3",
    "pyarrow==24.0.0",
    "huggingface-hub==0.35.3",
    "safetensors==0.8.0",
    "datasets==4.8.5",
    "av==15.1.0",
    "pillow==12.2.0",
    # closed_loop.py: gym-pusht 0.1.6 calls a pymunk API removed in pymunk 7
    "gym-pusht==0.1.6",
    "gymnasium==1.3.0",
    "pymunk==6.11.1",
]

[project.optional-dependencies]
figures = ["plotly==6.8.0", "kaleido==1.4.0"]
notebook = ["marimo==0.25.0", "plotly==6.8.0"]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false
